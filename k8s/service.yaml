apiVersion: v1
kind: Service
metadata:
  name: amazon-clone-service
  labels:
    app: amazon-clone
spec:
  # NodePort allows accessing the app via localhost:<nodePort> in Docker Desktop Kubernetes
  type: NodePort
  selector:
    app: amazon-clone
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
    protocol: TCP
    name: http
